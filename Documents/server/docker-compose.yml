services:
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Karachi
      - URL=jilaniplastic.com
      - VALIDATION=dns
      - SUBDOMAINS=wildcard #optional
      - CERTPROVIDER= #optional
      - DNSPLUGIN=cloudflare #optional
      - PROPAGATION= #optional
      - DUCKDNSTOKEN= #optional
      - EMAIL= #optional
      - ONLY_SUBDOMAINS=true #optional
      - EXTRA_DOMAINS= #optional
      - STAGING=false #optional
    volumes:
      - ./swag:/config
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  authelia:
    image: ghcr.io/authelia/authelia:latest
    container_name: authelia
    user: "1000:1000"
    environment:
      - TZ=Asia/Karachi
    volumes:
      - ./authelia:/config
    restart: unless-stopped
    command:
      - "authelia"
      - "--config=/config/configuration.yml"
      - "--config=/config/local.configuration.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  piserver:
    build: ../PiServer/
    container_name: piserver
    volumes:
      - ../PiServer/data:/data
    restart: unless-stopped
  budget:
    build: ../budget/
    container_name: budget
    environment:
      - PORT=80
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - /home/usama/NextCloud/data/usama/files/Drive/Documents/Budget:/src/data
    restart: unless-stopped
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
  homer:
    image: b4bz/homer:latest
    container_name: homer
    volumes:
      - ./homer/:/www/assets
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Karachi
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/:/config
      - ../../Downloads:/mnt
    restart: unless-stopped
  nextcloud:
    image: linuxserver/nextcloud:29.0.6
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ../../NextCloud/config:/config
      - ../../NextCloud/data:/data
    restart: unless-stopped
