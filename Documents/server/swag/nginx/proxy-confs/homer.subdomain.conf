## homer dashboard, reachable both as homer.jilaniplastic.com and usama.jilaniplastic.com
## (it also still serves at the usama8800.net root via homer.subfolder.conf)

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name homer.* usama.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app homer;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
